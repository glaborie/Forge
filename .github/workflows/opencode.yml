name: OpenCode Assistant

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.issue.body, '/opencode') ||
      contains(github.event.issue.body, '/oc') ||
      contains(github.event.pull_request.body, '/opencode') ||
      contains(github.event.pull_request.body, '/oc')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenCode v2.3.2
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.3.2

      - name: Run OpenCode on comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"

          ALLOWED_MODELS="opencode-go/deepseek-v4.1-flash opencode-go/beam-free"
          REQUESTED_MODEL=$(echo "$COMMENT_BODY" | grep -oE 'model=[a-zA-Z0-9._-]+' | cut -d= -f2)
          
          if [ -n "$REQUESTED_MODEL" ]; then
            CANDIDATE="opencode-go/${REQUESTED_MODEL}"
            if echo " $ALLOWED_MODELS " | grep -q " $CANDIDATE "; then
              MODEL="$CANDIDATE"
            else
              echo "Model '$CANDIDATE' is not allowed. Allowed: $ALLOWED_MODELS" >&2
              exit 1
            fi
          else
            MODEL="opencode-go/deepseek-v4.1-flash"
          fi
          
          RESPONSE=$(opencode run -w --archived --model "$MODEL" \
            "You were triggered by a comment on ${REPO}#${ISSUE_NUMBER}:
            ${COMMENT_BODY}

            Address the request using the repository context. If code changes are requested, create a new branch, commit the changes, and open a pull request using the 'gh' CLI. Otherwise, provide a direct technical answer.")

          gh issue comment "$ISSUE_NUMBER" --body "$RESPONSE"
