name: diag
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          gh --version
          echo "token user: $(gh api user --jq .login)"
          gh api -i user 2>/dev/null | grep -i "x-oauth-scopes" || echo "no classic scopes header"
          echo "--- issue 3 parent ---"
          gh api graphql -f query='query { repository(owner:"glaborie",name:"Forge"){ issue(number:3){ title parent { title } blockedBy(first:5){ nodes { number } } } } }'
          echo "--- first project item ---"
          ./scripts/fetch-items.sh 5 | jq '.[0]'
          echo "--- item count ---"
          ./scripts/fetch-items.sh 5 | jq 'length'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT_RO }}
