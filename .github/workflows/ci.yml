name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in an `if:` condition, so resolve presence here
      HAS_PROJECT_PAT: ${{ secrets.PROJECT_PAT_RO != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with Mypy
        run: uv run python -m mypy src/

      - name: Run tests with Pytest
        run: uv run pytest

      # Read-only on the board: this must never be able to mutate project 5.
      # Skipped on fork PRs, where repository secrets are not exposed.
      - name: Validate project board
        if: ${{ env.HAS_PROJECT_PAT == 'true' }}
        run: ./scripts/validate-project.sh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT_RO }}

      # Config-only: no containers are started, no credentials needed.
      - name: Validate deploy stack
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          python3 -c "import json; json.load(open('deploy/grafana/dashboards/reliability.json'))"
