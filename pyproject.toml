[project]
name = "forge-otel"
version = "0.1.0"
description = "OpenTelemetry instrumentation for an agent serving an OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "jsonschema>=4.21",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_otel"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/"]
