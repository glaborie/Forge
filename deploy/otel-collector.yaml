receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}

exporters:
  # Traces go to Langfuse Cloud. Endpoint and credentials come from deploy/.env.
  # Langfuse speaks OTLP/HTTP only; gRPC is not supported there.
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_STRING}"
      # Without this, v4 ingestion is batched and can lag up to 10 minutes.
      x-langfuse-ingestion-version: "4"

  # Metrics stay local: Prometheus scrapes this endpoint.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

  telemetry:
    metrics:
      level: none
